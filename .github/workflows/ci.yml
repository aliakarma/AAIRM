name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lint tools
        run: pip install ruff black mypy pydantic pydantic-settings
      - name: Ruff lint
        run: ruff check aairm/ tests/ scripts/ experiments/
      - name: Black format check
        run: black --check aairm/ tests/ scripts/ experiments/
      - name: Mypy type check
        run: mypy aairm/ --ignore-missing-imports

  test:
    name: Unit + smoke tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package + test deps
        run: |
          pip install -e ".[dev]" || pip install \
            numpy scipy pandas scikit-learn lightgbm \
            pydantic pydantic-settings structlog rich omegaconf \
            pytest pytest-cov pytest-asyncio pytest-timeout \
            --break-system-packages || true
          pip install -e . --no-deps || true
      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ tests/smoke/ \
            -v \
            -m "not llm and not slow" \
            --cov=aairm \
            --cov-report=term-missing \
            --cov-report=xml \
            --timeout=120
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.11'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]" || pip install numpy scipy pandas pydantic pydantic-settings structlog pytest pytest-cov pytest-timeout
      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ \
            -v \
            -m "not llm" \
            --timeout=300
