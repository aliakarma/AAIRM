# ===========================================================================
# AAIRM — M5 Forecasting Competition (Real-World) Configuration
# ===========================================================================
# Used by experiments/run_realworld.py for evaluation on Walmart M5 data.
# Download data first:  make download-data
# ===========================================================================

simulation:
  n_skus: 1200                    # top-1200 SKUs by total volume (see m5_adapter.py)
  n_categories: 5
  category_names:
    - grocery
    - frozen_food
    - apparel
    - dry_fruits
    - cosmetics
  skus_per_category: 240
  simulation_horizon_days: 1913   # full M5 training period
  test_horizon_days: 28           # M5 official evaluation window
  n_suppliers_min: 3
  n_suppliers_max: 5
  seed: 42

forecasting:
  architecture: tft
  forecast_horizon: 28            # M5 evaluation horizon is 28 days
  context_length: 90
  hidden_size: 256
  attention_head_size: 4
  dropout: 0.1
  batch_size: 128
  max_epochs: 100
  learning_rate: 0.0005
  loss: pinball                   # quantile forecasts better suit M5 WRMSSE
  quantiles: [0.1, 0.5, 0.9]

optimisation:
  mode: rl
  budget: 5000000.0              # larger budget for Walmart scale
  warehouse_capacity: 500000.0
  service_level: 0.95
  holding_cost_rate: 0.20
  penalty_cost_multiplier: 3.0
  discount_factor: 0.99
  rl_training_episodes: 200
  rl_learning_rate: 0.0003
  rl_n_steps: 2048
  rl_batch_size: 64
  rl_n_epochs: 10

supplier_ranking:
  alpha_1: 0.35
  alpha_2: 0.30
  alpha_3: 0.25
  alpha_4: 0.10

governance:
  max_single_supplier_fraction: 0.60
  shelf_life_safety_margin: 0.80
  human_approval_threshold: 100000.0
  frozen_zone_capacity: 80000.0
  ambient_zone_capacity: 420000.0

llm:
  model: gpt-4o
  temperature: 0.0
  max_tokens: 1024
  timeout: 30.0

results_dir: experiments/results/m5
log_level: INFO
log_format: json

# Real-world dataset specific keys
dataset: m5
data_dir: data/processed/m5
train_split: 0.80                # 80/20 train-test split
