# ===========================================================================
# AAIRM Scalability Evaluation — 500 SKUs, 5 seeds (42-46)
# ===========================================================================
# Reproduces product.tex Table 7 (tab:scalability-overview) and the dry-fruits
# recalibration (Table 8). Hyperparameters follow Tables 1-2, 500-SKU column.
# ===========================================================================

simulation:
  n_skus: 500
  n_categories: 5
  category_names: [grocery, frozen_food, apparel, cosmetics, dry_fruits]
  skus_per_category: 100            # 5 explicit categories, 100 SKU each
  simulation_horizon_days: 730
  test_horizon_days: 365
  n_suppliers_min: 3
  n_suppliers_max: 5
  seed: 42                          # runners sweep 42-46 (5 seeds)

forecasting:
  architecture: lstm
  forecast_horizon: 7
  context_length: 60
  hidden_size: 128
  dropout: 0.1
  batch_size: 64
  max_epochs: 50
  learning_rate: 0.001
  loss: mse

optimisation:
  mode: rl
  budget: 550000.0                  # B = 5.5e5  (Table 2, 500-SKU)
  warehouse_capacity: 45000.0       # V = 4.5e4  (Table 2, 500-SKU)
  service_level: 0.95
  holding_cost_rate: 0.25
  penalty_cost_multiplier: 3.0
  discount_factor: 0.995            # gamma (Table 2, 500-SKU)
  rl_training_episodes: 200         # Table 1
  rl_learning_rate: 0.0001          # 1e-4 (Table 2, 500-SKU)
  rl_n_steps: 2048
  rl_batch_size: 64
  rl_n_epochs: 10
  # PPO extras (Table 2, 500-SKU):
  #   clip_ratio: 0.2  entropy_coefficient: 0.025  value_function_coefficient: 0.5

supplier_ranking:
  alpha_1: 0.40                     # unit cost   (Table 2, 500-SKU)
  alpha_2: 0.25                     # lead time
  alpha_3: 0.25                     # reliability
  alpha_4: 0.10                     # MOQ penalty

governance:
  max_single_supplier_fraction: 0.60
  shelf_life_safety_margin: 0.80
  human_approval_threshold: 50000.0
  frozen_zone_capacity: 10000.0
  ambient_zone_capacity: 35000.0

reward_tuning:
  holding_cost_weight: 1.0
  stockout_penalty_weight: 1.2
  spoilage_cost_weight: 1.0
  inventory_cap_penalty: 0.5
  inventory_cap_days: 21
  shelf_life_scale: 0.5
  expiry_rate_multiplier: 1.5

# Per-category stockout penalty override for the dry-fruits recalibration
# (product.tex Table 8). Default keeps the documented 31.54% failure;
# set to 9.0 to restore a commercially standard 95.3% fill rate.
category_reward_overrides:
  dry_fruits:
    stockout_penalty_weight: 1.2    # recalibration sweep: 1.2 / 3.0 / 6.0 / 9.0

baselines:
  gbm_library: xgboost
  gbm_n_estimators: 300             # Table 2, 500-SKU

llm:
  model: gpt-4o-mini
  temperature: 0.0
  max_tokens: 1024
  timeout: 30.0

results_dir: experiments/results
log_level: INFO
log_format: console

experiment_name: scalability_500sku
experiment_seeds: [42, 43, 44, 45, 46]
canonical_fixture: table7_scalability_500sku
