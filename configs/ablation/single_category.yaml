# ===========================================================================
# Ablation: Single Category (grocery only, 240 SKUs)
# ===========================================================================
# Purpose: Isolate the contribution of cross-category coordination.
# Provides a controlled baseline for interpreting per-category results.

simulation:
  n_skus: 240
  n_categories: 1
  category_names: [grocery]
  skus_per_category: 240
  simulation_horizon_days: 730
  test_horizon_days: 365
  n_suppliers_min: 3
  n_suppliers_max: 5
  seed: 42

forecasting:
  architecture: tft
  forecast_horizon: 7
  context_length: 60
  hidden_size: 128
  attention_head_size: 4
  dropout: 0.1
  batch_size: 64
  max_epochs: 50
  learning_rate: 0.001
  loss: mse
  quantiles: [0.1, 0.5, 0.9]

optimisation:
  mode: rl
  budget: 200000.0               # reduced budget for single category
  warehouse_capacity: 20000.0
  service_level: 0.95
  holding_cost_rate: 0.25
  penalty_cost_multiplier: 3.0
  discount_factor: 0.99
  rl_training_episodes: 400
  rl_learning_rate: 0.0003
  rl_n_steps: 2048
  rl_batch_size: 64
  rl_n_epochs: 10

supplier_ranking:
  alpha_1: 0.35
  alpha_2: 0.30
  alpha_3: 0.25
  alpha_4: 0.10

governance:
  max_single_supplier_fraction: 0.60
  shelf_life_safety_margin: 0.80
  human_approval_threshold: 50000.0
  frozen_zone_capacity: 0.0      # not applicable to grocery-only
  ambient_zone_capacity: 20000.0

llm:
  model: gpt-4o
  temperature: 0.0
  max_tokens: 1024
  timeout: 30.0

results_dir: experiments/results/ablation/single_category
log_level: INFO
log_format: json

ablation_name: single_category
ablation_description: "Full AAIRM pipeline on grocery category only (240 SKUs)."
