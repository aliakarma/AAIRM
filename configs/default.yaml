# ===========================================================================
# AAIRM Default Configuration
# ===========================================================================
# All defaults reproduce the exact experimental conditions of:
#   Syed et al. (2025), "Agentic Commerce", Frontiers in [Journal].
#
# Override individual keys on the command line:
#   python experiments/run_paper_experiment.py simulation.seed=123
#
# Or load a child config that inherits from this file:
#   defaults:
#     - default
#     - _self_
# ===========================================================================

simulation:
  n_skus: 1200
  n_categories: 5
  category_names:
    - grocery
    - frozen_food
    - apparel
    - cosmetics
    - dry_fruits
  skus_per_category: 240          # computed automatically; listed for clarity
  simulation_horizon_days: 730    # 2-year horizon (train + test)
  test_horizon_days: 365          # 1-year test horizon (paper Section 5.1)
  n_suppliers_min: 3
  n_suppliers_max: 5
  seed: 42                        # all paper results use seed=42

forecasting:
  architecture: tft               # Temporal Fusion Transformer (paper default)
  forecast_horizon: 7             # 7-day ahead demand forecast
  context_length: 60              # 60-day history window
  hidden_size: 128
  attention_head_size: 4
  dropout: 0.1
  batch_size: 64
  max_epochs: 50
  learning_rate: 0.001
  loss: mse                       # mean squared error for point forecasts
  quantiles: [0.1, 0.5, 0.9]

optimisation:
  mode: rl                        # PPO-based policy (paper default)
  budget: 1000000.0               # purchasing budget B (Eq. 4)
  warehouse_capacity: 100000.0    # warehouse volume V (Eq. 4)
  service_level: 0.95             # target cycle service level
  holding_cost_rate: 0.25         # 25% annual holding cost
  penalty_cost_multiplier: 3.0    # stockout penalty = 3x unit cost
  discount_factor: 0.99           # RL discount factor gamma (Eq. 5)
  rl_training_episodes: 400       # convergence observed at episode ~250
  rl_learning_rate: 0.0003
  rl_n_steps: 2048
  rl_batch_size: 64
  rl_n_epochs: 10

supplier_ranking:
  alpha_1: 0.35                   # cost weight (Eq. 6)
  alpha_2: 0.30                   # lead-time weight
  alpha_3: 0.25                   # reliability weight (subtracted)
  alpha_4: 0.10                   # MOQ violation penalty

governance:
  max_single_supplier_fraction: 0.60
  shelf_life_safety_margin: 0.80
  human_approval_threshold: 50000.0
  frozen_zone_capacity: 20000.0
  ambient_zone_capacity: 80000.0

llm:
  model: gpt-4o
  temperature: 0.0                # deterministic reasoning
  max_tokens: 1024
  timeout: 30.0

results_dir: experiments/results
log_level: INFO
log_format: console
