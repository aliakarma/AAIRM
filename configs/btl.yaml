# ===========================================================================
# Blockchain Trust Ledger Evaluation — product.tex Table 10 (tab:btl-results)
# ===========================================================================
# Four-organization permissioned network (one peer per org, three Raft
# orderers) with digest-only on-chain anchoring of the five event types.
# Offered load is generated by replaying anchoring events from the 100-SKU
# simulation; tamper-evidence is exercised by an injected-mutation replay.

btl:
  n_organizations: 4                # retailer, supplier, logistics, auditor
  org_roles: [retailer, supplier_consortium, logistics_provider, independent_auditor]
  peers_per_org: 1
  raft_orderers: 3
  batch_timeout_s: 0.5
  batch_size_tx: 50
  base_decision_cycle_s: 3.2        # decision-cycle latency without anchoring
  storage_per_event_kb: 1.9
  anchoring: asynchronous           # pipeline proceeds on submit; commit via callback

mutation_replay:
  n_events: 10000
  n_mutations: 500
  mutated_fields: [quantity, price, supplier, verdict]
  seed: 42

throughput_sweep:
  loads_tx_s: [25, 50, 100, 150, 200, 250, 300, 330, 360, 390]

canonical_fixture: table10_btl
results_dir: experiments/results/btl
