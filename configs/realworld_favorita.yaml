# ===========================================================================
# AAIRM — Corporación Favorita (Real-World) Configuration
# ===========================================================================

simulation:
  n_skus: 1200
  n_categories: 5
  category_names:
    - grocery
    - frozen_food
    - apparel
    - cosmetics
    - dry_fruits
  skus_per_category: 240
  simulation_horizon_days: 1684   # Favorita: 2013-01-01 to 2017-08-31
  test_horizon_days: 16           # Favorita competition prediction window
  n_suppliers_min: 3
  n_suppliers_max: 5
  seed: 42

forecasting:
  architecture: tft
  forecast_horizon: 16
  context_length: 90
  hidden_size: 256
  attention_head_size: 4
  dropout: 0.1
  batch_size: 128
  max_epochs: 100
  learning_rate: 0.0005
  loss: pinball
  quantiles: [0.1, 0.5, 0.9]

optimisation:
  mode: rl
  budget: 2000000.0
  warehouse_capacity: 200000.0
  service_level: 0.95
  holding_cost_rate: 0.22
  penalty_cost_multiplier: 3.0
  discount_factor: 0.99
  rl_training_episodes: 200
  rl_learning_rate: 0.0003
  rl_n_steps: 2048
  rl_batch_size: 64
  rl_n_epochs: 10

supplier_ranking:
  alpha_1: 0.35
  alpha_2: 0.30
  alpha_3: 0.25
  alpha_4: 0.10

governance:
  max_single_supplier_fraction: 0.60
  shelf_life_safety_margin: 0.80
  human_approval_threshold: 75000.0
  frozen_zone_capacity: 40000.0
  ambient_zone_capacity: 160000.0

llm:
  model: gpt-4o
  temperature: 0.0
  max_tokens: 1024
  timeout: 30.0

results_dir: experiments/results/favorita
log_level: INFO
log_format: json

dataset: favorita
data_dir: data/processed/favorita
train_split: 0.80
